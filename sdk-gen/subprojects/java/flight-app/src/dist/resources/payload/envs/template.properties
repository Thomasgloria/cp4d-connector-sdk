
# =============================================================================
# Generic JDBC Connector - Environment Configuration Template
# =============================================================================
# This template file contains all environment variables that can be used to
# configure the Generic JDBC connector at deployment time.
#
# Instructions:
# 1. Copy this file and rename it (e.g., production.properties)
# 2. Uncomment and set the variables you need
# 3. Use the file with Docker: docker run --env-file production.properties
# =============================================================================

# -----------------------------------------------------------------------------
# IBM Cloud Platform Configuration
# -----------------------------------------------------------------------------
# API key for IBM Cloud authentication
#apikey=

# Authentication API endpoint
auth_uri=https://iam.cloud.ibm.com/identity/token

# Datasource types API endpoint
datasource_types_uri=https://api.dataplatform.cloud.ibm.com:443/v2/datasource_types

# URI of deployed Flight service (e.g., grpc://host:port)
#flight_uri=

# Path to certificate of your deployed Flight service
#ssl_certificate_path=

# SSL certificate validation (true/false)
ssl_certificate_validation=false

# -----------------------------------------------------------------------------
# Connector Identity Configuration
# -----------------------------------------------------------------------------
# The unique identifier name for the datasource type
# Default: custom_genericjdbc
# Example: custom_mysql_prod, custom_oracle_hr, custom_postgres_analytics
#CONNECTOR_DATASOURCE_TYPE=custom_genericjdbc

# The display label for the connector (shown in CP4D UI)
# Default: Generic JDBC (custom)
# Example: Production MySQL Database, Oracle HR Database
#CONNECTOR_LABEL=Generic JDBC (custom)

# The description of the connector (shown in CP4D UI)
# Default: Default description from properties
# Example: MySQL production database connector, Oracle database for HR applications
#CONNECTOR_DESCRIPTION=

# -----------------------------------------------------------------------------
# JDBC Driver Configuration
# -----------------------------------------------------------------------------
# Fully qualified class name of the JDBC driver
# Default: Auto-detected from JDBC URL
# When set, this driver class will be used instead of auto-detection
# This is useful for custom or proprietary JDBC drivers
#
# Common examples:
#   MySQL:      com.mysql.cj.jdbc.Driver
#   PostgreSQL: org.postgresql.Driver
#   Oracle:     oracle.jdbc.OracleDriver
#   SQL Server: com.microsoft.sqlserver.jdbc.SQLServerDriver
#   DB2:        com.ibm.db2.jcc.DB2Driver
#   MariaDB:    org.mariadb.jdbc.Driver
#
#JDBC_DRIVER_CLASS=

# -----------------------------------------------------------------------------
# Row Limit Configuration
# -----------------------------------------------------------------------------
# Custom SQL prefix for row limiting
# Use ${row_limit} as a placeholder for the actual row limit value
# Default: Auto-detected from driver
#
# Examples:
#   SQL Server: TOP ${row_limit}
#   Sybase:     TOP ${row_limit}
#
#ROW_LIMIT_PREFIX=

# Custom SQL suffix for row limiting
# Use ${row_limit} as a placeholder for the actual row limit value
# Default: Auto-detected from driver
#
# Examples:
#   MySQL/PostgreSQL: LIMIT ${row_limit}
#   Oracle:           FETCH FIRST ${row_limit} ROWS ONLY
#   DB2:              FETCH FIRST ${row_limit} ROWS ONLY
#
#ROW_LIMIT_SUFFIX=

# =============================================================================
# Configuration Examples
# =============================================================================
#
# Example 1: MySQL Production Database
# -------------------------------------
# CONNECTOR_DATASOURCE_TYPE=custom_mysql_prod
# CONNECTOR_LABEL=Production MySQL Database
# CONNECTOR_DESCRIPTION=MySQL production database connector
# JDBC_DRIVER_CLASS=com.mysql.cj.jdbc.Driver
# ROW_LIMIT_SUFFIX=LIMIT ${row_limit}
#
# Example 2: Oracle HR Database
# ------------------------------
# CONNECTOR_DATASOURCE_TYPE=custom_oracle_hr
# CONNECTOR_LABEL=Oracle HR Database
# CONNECTOR_DESCRIPTION=Oracle database for HR applications
# JDBC_DRIVER_CLASS=oracle.jdbc.OracleDriver
# ROW_LIMIT_SUFFIX=FETCH FIRST ${row_limit} ROWS ONLY
#
# Example 3: PostgreSQL Analytics
# --------------------------------
# CONNECTOR_DATASOURCE_TYPE=custom_postgres_analytics
# CONNECTOR_LABEL=PostgreSQL Analytics
# CONNECTOR_DESCRIPTION=PostgreSQL database for analytics
# JDBC_DRIVER_CLASS=org.postgresql.Driver
# ROW_LIMIT_SUFFIX=LIMIT ${row_limit}
#
# Example 4: SQL Server with Custom Driver
# -----------------------------------------
# CONNECTOR_DATASOURCE_TYPE=custom_sqlserver_warehouse
